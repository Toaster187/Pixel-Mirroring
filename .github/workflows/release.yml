name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.4.1'

      - name: Build Android App
        run: gradle assembleDebug
        working-directory: Android

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  build-windows:
    name: Build Windows Client & Installers
    runs-on: windows-latest
    needs: build-android
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/Client/vcpkg_cache
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: Android/app/build/outputs/apk/debug

      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Create vcpkg cache directory
        run: mkdir -p Client/vcpkg_cache
        shell: bash

      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: Client/vcpkg_cache
          key: ${{ runner.os }}-vcpkg-bin-${{ hashFiles('Client/vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-bin-

      - name: Bootstrap vcpkg
        run: ./Client/vcpkg/bootstrap-vcpkg.bat
        shell: cmd

      # Beide APKs werden über install(... OPTIONAL) eingepackt, ein fehlendes Paket
      # fällt also von allein nicht auf. PM_REQUIRE_FOSSIFY: ohne den Launcher liefe
      # jeder Nutzer in die Rückfallebene, weil der virtuelle Bildschirm standardmäßig an
      # ist. PM_REQUIRE_ANDROID_APK: ohne die Companion-App kann der Installer überhaupt
      # kein Handy einrichten. Beides soll den Build laut scheitern lassen.
      - name: Configure CMake
        run: cmake --preset default -DCMAKE_BUILD_TYPE=Release -DPM_REQUIRE_FOSSIFY=ON -DPM_REQUIRE_ANDROID_APK=ON
        working-directory: Client

      - name: Build Client
        run: cmake --build build
        working-directory: Client

      - name: Install NSIS
        run: choco install nsis -y

      - name: Run CPack Packaging
        run: |
          cd build
          cpack -C Release
        working-directory: Client
        shell: bash

      # Letzte Kontrolle am fertigen Paket statt am Build-Verzeichnis: das ZIP entsteht
      # aus demselben Install-Baum wie der NSIS-Installer, ist aber ohne Windows-
      # Werkzeuge lesbar. Der .exe-Installer wird eigens geprüft, weil das Upload unten
      # schon zufrieden ist, wenn irgendeines der drei Muster etwas findet.
      - name: Verify packaged payload
        working-directory: Client/build
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(ls PixelMirroring-*.zip | head -1)
          echo "Prüfe $ZIP"
          cmake -E tar tf "$ZIP" > contents.txt
          cat contents.txt
          for f in PixelMirroring.apk FossifyLauncher.apk scrcpy-server.jar adb.exe \
                   licenses/GPL-3.0.txt licenses/FossifyLauncher.md; do
            if ! grep -q -- "$f" contents.txt; then
              echo "::error::Fehlt im Auslieferungspaket: $f"
              exit 1
            fi
          done
          ls PixelMirroring-*.exe >/dev/null || { echo "::error::Kein NSIS-Installer gebaut"; exit 1; }
          echo "Alle mitgelieferten Dateien vorhanden."
          rm -f contents.txt

      - name: Upload Installers as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PixelMirroring-Installers
          path: |
            Client/build/PixelMirroring-*.zip
            Client/build/PixelMirroring-*.exe
            Client/build/PixelMirroring-*.msi
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            Client/build/PixelMirroring-*.zip
            Client/build/PixelMirroring-*.exe
            Client/build/PixelMirroring-*.msi
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
