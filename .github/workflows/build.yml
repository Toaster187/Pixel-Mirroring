name: Build (PR)

# Bis hierher lief CI nur auf Tags. An einem Pull Request hingen damit null
# Check-Runs — auch an großen. Dieser Workflow übersetzt beide Komponenten so, wie
# die Auslieferung sie übersetzt (Android per Gradle, Windows mit MSVC und /utf-8),
# packt aber nichts und veröffentlicht nichts.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Ein neuer Push auf denselben Branch macht den vorherigen Lauf überflüssig.
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.4.1'

      - name: Build Android App
        run: gradle assembleDebug
        working-directory: Android

  build-windows:
    name: Windows Client (MSVC)
    runs-on: windows-latest
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/Client/vcpkg_cache
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Create vcpkg cache directory
        run: mkdir -p Client/vcpkg_cache
        shell: bash

      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: Client/vcpkg_cache
          key: ${{ runner.os }}-vcpkg-bin-${{ hashFiles('Client/vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-bin-

      - name: Bootstrap vcpkg
        run: ./Client/vcpkg/bootstrap-vcpkg.bat
        shell: cmd

      - name: Configure CMake
        run: cmake --preset default -DCMAKE_BUILD_TYPE=Release
        working-directory: Client

      # Kein cpack, kein NSIS: hier geht es nur darum, dass der Code mit demselben
      # Compiler und denselben Schaltern übersetzt wie die Auslieferung.
      - name: Build Client
        run: cmake --build build
        working-directory: Client

      - name: Run self-checks
        run: ctest --test-dir build --output-on-failure
        working-directory: Client
